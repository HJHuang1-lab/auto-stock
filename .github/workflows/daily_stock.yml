name: 📈 每日盤後股票 AI 分析 + 部署 Firebase

on:
  schedule:
    # 週一至週五 07:07 UTC = 台灣時間 15:07
    - cron: '7 7 * * 1-5'
  workflow_dispatch:
    # 允許手動在 GitHub 網頁上按按鈕觸發（方便測試）
    inputs:
      force_weekly:
        description: '強制執行週五驗收 (true/false)'
        required: false
        default: 'false'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest   # GitHub 免費提供的 Linux 虛擬機器
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      # ── Step 1：下載程式碼 ──────────────────────────────────
      - name: ⬇️ Checkout 程式碼
        uses: actions/checkout@v3

      # ── Step 2：設定 Python ──────────────────────────────────
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── Step 3：安裝 Python 依賴 ────────────────────────────
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # ── Step 4：執行資料更新腳本 ────────────────────────────
      - name: 📊 Run data updater script
        run: python data_exporter.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8

      # ── Step 5：週五額外驗收 ────────────────────────────────
      - name: 📅 週五驗收 (如果今天是週五或手動強制)
        run: |
          DAY=$(date +%u)
          FORCE="${{ github.event.inputs.force_weekly }}"
          if [ "$DAY" = "5" ] || [ "$FORCE" = "true" ]; then
            echo "📅 今天是週五！執行週驗收 + AI 自我進化..."
            python -c "
          import sys
          sys.stdout.reconfigure(encoding='utf-8')
          try:
              from weekly_evaluator import run_weekly_verification_and_optimize
              result = run_weekly_verification_and_optimize()
              print(f'✅ 週驗收完成！命中率: {result.get(\"hit_rate\", \"N/A\")}%')
          except Exception as e:
              print(f'⚠️ 週驗收錯誤（不影響部署）: {e}')
          "
            python data_exporter.py
          else
            echo "📌 今天是星期 $DAY，非週五，跳過週驗收。"
          fi
        env:
          PYTHONIOENCODING: utf-8

      # ── Step 6：提交更新後的 JSON 回 repo ────────────────────
      - name: 💾 Commit 更新的資料
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add static/data/
          git add stock_cache.json optimization_weights.json verification_history.json || true
          git diff --staged --quiet || git commit -m "🤖 [自動更新] $(date +'%Y-%m-%d') 盤後股票 AI 分析資料"
          git push

      # ── Step 7：部署到 Firebase Hosting ─────────────────────
      - name: 🔥 Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
