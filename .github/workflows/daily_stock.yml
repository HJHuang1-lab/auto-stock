name: 📈 每日盤後股票 AI 分析 + 部署 Firebase

on:
  schedule:
    # 週一至週五 07:07 UTC = 台灣時間 15:07
    - cron: '7 7 * * 1-5'
  workflow_dispatch:
    # 允許手動觸發（用於測試）
    inputs:
      force_weekly:
        description: '強制執行週五驗收（true/false）'
        required: false
        default: 'false'

jobs:
  analyze-and-deploy:
    name: 分析股票 + 部署
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Step 1：下載程式碼 ──────────────────────────────────
      - name: ⬇️ Checkout 程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2：設定 Python ──────────────────────────────────
      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Step 3：安裝依賴 ────────────────────────────────────
      - name: 📦 安裝 Python 套件
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy

      # ── Step 4：執行資料匯出腳本 ────────────────────────────
      - name: 📊 執行盤後 AI 分析 + 資料輸出
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python data_exporter.py

      # ── Step 5：週五額外驗收（判斷今天是否為週五）──────────
      - name: 📅 週五驗收 (如果今天是週五或手動強制)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          DAY=$(date +%u)
          FORCE="${{ github.event.inputs.force_weekly }}"
          if [ "$DAY" = "5" ] || [ "$FORCE" = "true" ]; then
            echo "📅 今天是週五（或手動觸發）！執行週驗收..."
            python -c "
          import sys
          sys.stdout.reconfigure(encoding='utf-8')
          try:
              from weekly_evaluator import run_weekly_verification_and_optimize
              result = run_weekly_verification_and_optimize()
              print(f'✅ 週驗收完成！命中率: {result.get(\"hit_rate\", \"N/A\")}%')
          except Exception as e:
              print(f'⚠️ 週驗收錯誤（不影響部署）: {e}')
          "
            # 重新複製更新後的 JSON
            python data_exporter.py
          else
            echo "📌 今天是星期 $DAY，非週五，跳過週驗收。"
          fi

      # ── Step 6：列出 static/data/ 確認輸出 ──────────────────
      - name: 🔍 確認輸出的 JSON 檔案
        run: |
          echo "=== static/data/ 目錄內容 ==="
          ls -lh static/data/
          echo "=== meta.json 內容 ==="
          cat static/data/meta.json

      # ── Step 7：提交更新後的 JSON 回 repo ────────────────────
      - name: 💾 Commit 更新的資料到 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add static/data/
          git add stock_cache.json optimization_weights.json verification_history.json || true
          git diff --staged --quiet || git commit -m "🤖 [自動更新] $(date +'%Y-%m-%d') 盤後股票 AI 分析資料"

      - name: 🚀 Push 到 GitHub
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      # ── Step 8：部署到 Firebase Hosting ─────────────────────
      - name: 🔥 部署到 Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: my-stock-ai-dashboard
